[project]
name = "driveops-mcp"
version = "0.3.2"
description = "Open-source MCP-native Google Drive operations layer with plans, approvals, undo, and audit logs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]==2.0.0",
    "cryptography>=50.0.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.136.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.12.0",
    "pyasn1>=0.6.4",
    "pypdf>=6.16.1",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.12.0",
]

[project.scripts]
driveops-mcp = "driveops_mcp.server:main"
gdrive-mcp = "driveops_mcp.server:main"

[project.urls]
Repository = "https://github.com/satyalyadav/driveops_mcp"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
